[versions]
agp = "9.4.0"
junit = "4.13.2"
junitVersion = "1.1.5"
# Espresso 3.5.1 and androidx.test.ext:junit 1.1.5 are the Android Studio template
# defaults. They cannot initialise on an API 37 system image, so the instrumented suite
# runs against API 35 or below -- see tools/run_instrumented_tests.sh, which enforces
# that. minSdk is 26, so this is ordinary practice rather than a compromise.
#
# Before raising either version, read the current numbers from
# https://developer.android.com/jetpack/androidx/releases/test and note that
# espresso-core, androidx.test.ext:junit, androidx.test:core and androidx.test:runner
# are separately versioned and must be kept mutually compatible. The tests already use
# androidx.test.core (ActivityScenario, ApplicationProvider), which arrives transitively
# today; declare it explicitly if these versions ever change.
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
gson = "2.14.0"
robolectric = "4.17"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
